  secretPanel(w,{x0:-hw-.3,x1:-hw,z0:-101.5,z1:-98.5,h:h,mat:wall,ix:-.6,iz:-100});
  decal(w,-hw+.02,1.1,-98,0,PI/2,1,.4,Object.assign({text:'E O A',w:256,h:100,size:60,fg:'rgba(255,255,255,.55)',rz:.06},hand));
  const rmM={wall:wall,floor:floor,ceil:ceil};
  room(w,{x0:-9,x1:-hw-.3,z0:-104,z1:-96,h:h,mats:rmM,skip:'E',light:0x9fc8ff,I:1.0,dist:12});
  decal(w,-8.98,1.6,-100,0,PI/2,3.4,1.1,{text:'AQUI ELE NÃO ENTRA',sub:'E O A!',w:512,h:200,size:56,fg:'#d8e8ff',glow:'#8af',basic:true,tint:0xbbbbbb});
  decal(w,-5.5,1.6,-103.98,0,0,3.2,.8,Object.assign({text:CONFIG.membros.join(' · '),w:1024,h:160,size:54,fg:'rgba(220,235,255,.8)'},hand));
  w.inter.push({x:-6,z:-100,r:2.5,label:'Ler o diário',fn:()=>say('"Corri duzentos metros e ainda ouço os passos. A saída existe: é verde, no fim do corredor. — alguém do E O A!"',10)});
  // saída
  standingDoor(w,{x:0,z:Z0+.05,ry:0,glow:0x66ff88,label:'Atravessar a saída',sign:{text:'SAÍDA',fg:'#9dffb0',glow:'#2f8',size:80},onUse:()=>{if(!relics.has(5))collect(5);setTimeout(()=>goLevel('hub'),2500)}});
  // a entidade
  const ent=new THREE.Group(),em=new THREE.MeshStandardMaterial({color:0x050505,roughness:1});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.8,2.4,.35),em);body.position.y=1.5;ent.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),em);head.scale.set(.8,1.2,.8);head.position.y=3;ent.add(head);
  [-.55,.55].forEach(x=>{const a=new THREE.Mesh(new THREE.BoxGeometry(.14,2.2,.14),em);a.position.set(x,1.4,0);ent.add(a)});
  const eyeM=new THREE.MeshBasicMaterial({color:0xff2a1a,fog:false,side:THREE.DoubleSide});
  [-.14,.14].forEach(x=>{const e=new THREE.Mesh(new THREE.PlaneGeometry(.1,.05),eyeM);e.position.set(x,3.05,-.28);e.rotation.y=PI;ent.add(e)});
  w.scene.add(ent);
  let entZ=36,grace=7,caught=false,heart=0;
  const reset=()=>{entZ=36;grace=5;caught=false};w.onTp=reset;
  w.upd.push((dt,t)=>{
    const inSafe=player.x<-2.4&&player.z>-104&&player.z<-96;
    if(!caught&&controlsOn&&mode==='play'){grace-=dt;if(inSafe)entZ=Math.min(entZ+4*dt,player.z+45);else if(grace<=0)entZ-=4.3*dt}
    ent.position.set(Math.sin(t*1.7)*.3,Math.sin(t*9)*.03,entZ);ent.visible=Math.abs(entZ-player.z)<70;
    const d=entZ-player.z;$('#danger').style.opacity=caught?0:clamp(1-d/22,0,.75);
    if(controlsOn&&!caught&&d<42){heart-=dt;if(heart<=0){A.thump(clamp(.25-d/200,.05,.25));heart=lerp(.35,1.1,clamp(d/42,0,1))}}
    if(!caught&&grace<=0&&!inSafe&&d<1.2&&controlsOn){caught=true;A.scare();tp(0,0,0,'Ele te alcançou. Corra mais rápido (SHIFT).')}});
  return w}

/* ============ tabela de níveis ============ */
const LV={
 hub:{title:'ARQUIVO',sub:'E O A!',build:lvHub,spawn:{x:0,z:22,yaw:0},hint:'Escolha uma porta. Seis fragmentos estão escondidos nos outros níveis.'},
 '0':{title:'NÍVEL 0',sub:'BACKROOMS',build:lvBack,spawn:{x:3,z:3,yaw:-PI/2},back:12,hint:'Procure uma parede marcada com E O A.'},
 '37':{title:'NÍVEL 37',sub:'POOLROOMS',build:lvPool,spawn:{x:6,z:6,yaw:-PI/2},back:0,hint:'Água na cintura. Há uma parede marcada no canto mais distante.'},
 '9':{title:'NÍVEL 9',sub:'SUBÚRBIO INFINITO',build:lvSub,spawn:{x:2,z:60,yaw:0},back:-12,hint:'Uma casa deixou a porta aberta. A rua nunca termina.'},
 '7':{title:'NÍVEL 7',sub:'OCEANO',build:lvOcean,spawn:{x:0,z:12,yaw:0},back:12,hint:'ESPAÇO sobe · SHIFT desce. A porta no centro leva a outro lugar. Suba até a superfície para sair.'},
 '94':{title:'NÍVEL 94',sub:'FLORESTA',build:lvForest,spawn:{x:0,z:0,yaw:PI/2},back:0,hint:'Há um arco de pedra a leste. A saída está atrás de você.'},
 'x':{title:'NÍVEL !',sub:'RUN FOR YOUR LIFE',build:lvRed,spawn:{x:0,z:0,yaw:0},back:-12,hint:'CORRA (SHIFT). Ele vem de trás. A saída verde está a 200 metros.'}
};
function disposeWorld(o){if(!o)return;o.scene.traverse(m=>{if(m.geometry)m.geometry.dispose();
  if(m.material)(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>{if(x.map)x.map.dispose();x.dispose()});
  if(m.shadow&&m.shadow.map)m.shadow.map.dispose()})}
function load(id,opt){opt=opt||{};const old=W,def=LV[id],nw=def.build();nw.id=id;W=nw;disposeWorld(old);
  const s=opt.spawn||def.spawn;player.x=s.x;player.z=s.z;player.yaw=s.yaw||0;player.pitch=0;player.y=W.groundH(s.x,s.z)+(W.swimStart||W.eye);
  vel.x=vel.y=vel.z=0;stepAcc=0;renderer.toneMappingExposure=W.exp;$('#danger').style.opacity=0;
  const sv=(W.swimFn&&TOUCH)?'flex':'none';$('#bUp').style.display=sv;$('#bDn').style.display=sv;
  A.amb(id);updHud();setTimeout(()=>{if(W&&W.id===id&&mode==='play')say(def.hint,8)},1800)}
function goLevel(id,opt){if(busy)return;opt=opt||{};
  if(id==='hub'&&!opt.spawn&&W&&W.id!=='hub'&&LV[W.id].back!==undefined)opt.spawn={x:0,z:LV[W.id].back,yaw:0};
  busy=true;controlsOn=false;const f=$('#fade'),ft=$('#fadeT'),fs=$('#fadeS'),info=LV[id];
  ft.textContent=info.title;fs.textContent=info.sub;f.style.display='flex';gsap.set([ft,fs],{opacity:0});gsap.set(ft,{letterSpacing:'.1em'});
  const up=()=>camera.updateProjectionMatrix();
  gsap.timeline()
    .to(camera,{fov:105,duration:1,ease:'power3.in',onUpdate:up},0)
    .to(f,{opacity:1,duration:1,ease:'power2.in'},.1)
    .add(()=>{camera.fov=60;up();load(id,opt)})
    .to(ft,{opacity:1,letterSpacing:'.32em',duration:1.4,ease:'power2.out'})
    .to(fs,{opacity:.85,duration:.8},'-=.8')
    .to({},{duration:.7})
    .to([ft,fs],{opacity:0,duration:.5})
    .to(f,{opacity:0,duration:1.3,ease:'power2.inOut'},'<')
    .to(camera,{fov:72,duration:1.4,ease:'power2.out',onUpdate:up},'<')
    .add(()=>{f.style.display='none';busy=false;controlsOn=true})}
function tp(x,z,yaw,msg){if(busy)return;busy=true;controlsOn=false;const f=$('#fade');f.style.display='flex';gsap.set(['#fadeT','#fadeS'],{opacity:0});
  gsap.to(f,{opacity:1,duration:.6,onComplete:()=>{player.x=x;player.z=z;player.yaw=yaw||0;player.pitch=0;
    player.y=W.tpY?W.tpY(x,z):W.groundH(x,z)+W.eye;vel.x=vel.y=vel.z=0;if(W.onTp)W.onTp();
    gsap.to(f,{opacity:0,duration:.9,delay:.25,onComplete:()=>{f.style.display='none';busy=false;controlsOn=true;if(msg)say(msg,6)}})}})}

/* ============ controles ============ */
const joy={s:0,f:0},touchV={up:false,dn:false};let bobY=0;
const K=c=>!!keys[c];
function blocked(x,z){const r=.32;
  if(W.bounds){let ok=false;for(const b of W.bounds)if(x>b.x0&&x<b.x1&&z>b.z0&&z<b.z1){ok=true;break}if(!ok)return true}
  for(const q of W.rects){if(q.on===false)continue;if(x>q.x0-r&&x<q.x1+r&&z>q.z0-r&&z<q.z1+r)return true}
  for(const c of W.circles){const dx=x-c.x,dz=z-c.z,rr=c.r+r;if(dx*dx+dz*dz<rr*rr)return true}
  return false}
function tryMove(dx,dz){const nx=player.x+dx;if(!blocked(nx,player.z))player.x=nx;const nz=player.z+dz;if(!blocked(player.x,nz))player.z=nz}
function look(dx,dy){const s=.0022;player.yaw-=dx*s;player.pitch=clamp(player.pitch-dy*s,-1.45,1.45)}
function control(dt){
  const sw=W.swimFn?!!W.swimFn():false;
  let f=(K('KeyW')||K('ArrowUp')?1:0)-(K('KeyS')||K('ArrowDown')?1:0)+joy.f,s=(K('KeyD')?1:0)-(K('KeyA')?1:0)+joy.s;
  if(K('ArrowLeft'))player.yaw+=1.8*dt;if(K('ArrowRight'))player.yaw-=1.8*dt;
  const ln=Math.hypot(f,s);if(ln>1){f/=ln;s/=ln}
  const shift=K('ShiftLeft')||K('ShiftRight');
  const v=sw?((K('Space')||touchV.up?1:0)-(shift||K('KeyC')||touchV.dn?1:0)):0;
  const run=!sw&&(shift||runToggle),spd=W.speed*(run?W.runMul:1);
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);let mx,mz,my=0;
  if(sw){const cp=Math.cos(player.pitch),sp=Math.sin(player.pitch);mx=-sy*cp*f+cy*s;mz=-cy*cp*f-sy*s;my=sp*f+v}
  else{mx=-sy*f+cy*s;mz=-cy*f-sy*s}
  const k=1-Math.exp(-(sw?2.5:14)*dt);
  vel.x+=(mx*spd-vel.x)*k;vel.z+=(mz*spd-vel.z)*k;vel.y+=(my*spd-vel.y)*k;
  tryMove(vel.x*dt,vel.z*dt);
  if(W.wrapZ){let sh=0;if(player.z>W.wrapZ)sh=-2*W.wrapZ;else if(player.z<-W.wrapZ)sh=2*W.wrapZ;if(sh){player.z+=sh;for(const q of W.lampList){q.l.position.z+=sh;q.tz+=sh}}}
  const sp2=Math.hypot(vel.x,vel.z);
  if(sw){player.y+=vel.y*dt;player.y=clamp(player.y,W.groundH(player.x,player.z)+.9,W.ceilY);bobY=Math.sin(performance.now()*.0012)*.05}
  else{const target=W.groundH(player.x,player.z)+W.eye;player.y+=(target-player.y)*(1-Math.exp(-10*dt));
    stepAcc+=sp2*dt;if(sp2>.6&&stepAcc>(run?1.5:1.9)){stepAcc=0;A.step(W.stepKind())}
    player.bob+=sp2*dt*2.4;bobY=Math.sin(player.bob)*.04*Math.min(1,sp2/W.speed)}}
function checkInter(){let best=1e9,n=null;
  if(controlsOn)for(const it of W.inter){if(it.off)continue;const dx=player.x-it.x,dz=player.z-it.z,d=dx*dx+dz*dz;if(d<it.r*it.r&&d<best){best=d;n=it}}
  near=n;const txt=n?'['+(TOUCH?'AGIR':'E')+'] '+n.label:'';
  if(txt!==lastPrompt){lastPrompt=txt;const el=$('#prompt');if(txt)el.textContent=txt;gsap.to(el,{opacity:txt?1:0,duration:.25})}}
function doInteract(){if(near&&controlsOn&&!busy){const it=near;it.fn(it);if(it.once)it.off=true}}

/* ============ entrada: teclado, mouse, toque ============ */
addEventListener('keydown',e=>{keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
  if(e.repeat)return;if(e.code==='KeyE')doInteract();if(e.code==='KeyM')toggleSnd();
  if(W&&W.id==='hub'&&controlsOn&&/^Digit[1-6]$/.test(e.code))goLevel(ORDER[+e.code.slice(5)-1])});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const cvEl=$('#gl');let drag=false;
cvEl.addEventListener('mousedown',()=>{drag=true;if(controlsOn&&!TOUCH&&document.pointerLockElement!==cvEl){try{const p=cvEl.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(err){}}});
addEventListener('mouseup',()=>{drag=false});
addEventListener('mousemove',e=>{if(!controlsOn||TOUCH)return;if(document.pointerLockElement===cvEl||drag)look(e.movementX||0,e.movementY||0)});
let lookId=null,lx=0,ly=0;
cvEl.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY}},{passive:false});
cvEl.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lookId&&controlsOn){look((t.clientX-lx)*1.4,(t.clientY-ly)*1.4);lx=t.clientX;ly=t.clientY}},{passive:false});
const endLook=e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null};
cvEl.addEventListener('touchend',endLook);cvEl.addEventListener('touchcancel',endLook);
const joyEl=$('#joy'),knob=$('#knob');let joyId=null,jc={x:0,y:0};
function joyMove(t){let dx=t.clientX-jc.x,dy=t.clientY-jc.y;const m=Math.hypot(dx,dy),R=50;if(m>R){dx=dx/m*R;dy=dy/m*R}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.s=dx/R;joy.f=-dy/R}
joyEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];joyId=t.identifier;const r=joyEl.getBoundingClientRect();jc={x:r.left+r.width/2,y:r.top+r.height/2};joyMove(t)},{passive:false});
joyEl.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)joyMove(t)},{passive:false});
const joyEnd=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;joy.s=joy.f=0;knob.style.transform='none'}};
joyEl.addEventListener('touchend',joyEnd);joyEl.addEventListener('touchcancel',joyEnd);
function bind(id,fn){const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn(true)},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();fn(false)},{passive:false});el.addEventListener('mousedown',()=>fn(true));el.addEventListener('mouseup',()=>fn(false))}
bind('#bAct',d=>{if(d)doInteract()});bind('#bRun',d=>{if(d){runToggle=!runToggle;$('#bRun').classList.toggle('on',runToggle)}});
bind('#bUp',d=>{touchV.up=d});bind('#bDn',d=>{touchV.dn=d});
function toggleSnd(){A.on=!A.on;if(A.ctx)A.setOn(A.on);$('#snd').textContent='SOM: '+(A.on?'LIGADO':'DESLIGADO');$('#bSnd').textContent=A.on?'SOM':'MUDO'}
$('#snd').addEventListener('click',e=>{e.stopPropagation();toggleSnd();if(A.on&&!A.ctx){A.init();A.resume();A.amb(W.id)}});
$('#bSnd').addEventListener('click',toggleSnd);
$('#bMenu').addEventListener('click',()=>{if(W&&W.id!=='hub')goLevel('hub')});

/* ============ loop principal ============ */
const clock=new THREE.Clock(),gc=$('#grain'),gx=gc.getContext('2d');let gf=0,introTween=null;
function grain(){const id=gx.createImageData(160,90),d=id.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gx.putImageData(id,0,0)}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;if(!W)return;W.t+=dt;
  if(mode==='play'&&controlsOn)control(dt);
  else if(mode==='intro'){player.yaw=Math.sin(t*.25)*.06;player.pitch=-.02+Math.sin(t*.4)*.02;player.x=Math.sin(t*.2)*.35;player.y=1.7+Math.sin(t*.9)*.02;bobY=0}
  for(const u of W.upd)u(dt,t);
  if(mode==='play')checkInter();
  camera.position.set(player.x,player.y+bobY,player.z);camera.rotation.set(player.pitch,player.yaw,0);
  if(W.sky)W.sky.position.copy(camera.position);
  if((gf++&1)===0)grain();
  renderer.render(W.scene,camera)}

/* ============ início ============ */
$('#enter').addEventListener('click',()=>{if(mode!=='intro')return;
  A.init();A.resume();A.amb('hub');if(introTween)introTween.kill();mode='play';controlsOn=false;player.z=Math.min(player.z,26);player.x=0;
  $('#intro').style.pointerEvents='none';$('#hud').style.display='block';
  gsap.to('#intro',{opacity:0,duration:2.2,ease:'power2.inOut',onComplete:()=>{$('#intro').style.display='none';controlsOn=true}});
  gsap.fromTo(camera,{fov:52},{fov:72,duration:2.6,ease:'power2.out',onUpdate:()=>camera.updateProjectionMatrix()});
  const hp=$('#help');hp.textContent=TOUCH?'joystick: andar · arraste a tela: olhar · AGIR: interagir · CORRER: alterna':'WASD andar · MOUSE olhar (clique p/ capturar) · SHIFT correr · E agir · M som · teclas 1–6: atalho dos níveis';
  gsap.to(hp,{opacity:.85,duration:1.5,delay:2.4});gsap.to(hp,{opacity:0,duration:2,delay:12});
  $('#bSnd').textContent=A.on?'SOM':'MUDO';updHud()});
function boot(){load('hub',{spawn:{x:0,z:30,yaw:0}});mode='intro';
  introTween=gsap.to(player,{z:15,duration:24,ease:'sine.inOut',yoyo:true,repeat:-1});
  gsap.from('.title',{opacity:0,duration:3.5,ease:'power2.out'});gsap.from('.sub',{opacity:0,duration:2,delay:1.6});gsap.from('#enter',{opacity:0,duration:2,delay:2.8});
  requestAnimationFrame(frame)}
const fontsReady=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load('900 60px Cinzel'),document.fonts.load('700 60px Cinzel'),document.fonts.load('40px "Permanent Marker"'),document.fonts.load('30px VT323')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(boot,boot);
})();
